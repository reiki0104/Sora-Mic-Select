
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sora Select | マイク比較</title>
<style>
:root{--green:#a3ff57;--bg:#080b09;--panel:#111713;--line:#29382d;--muted:#a1aca4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#f3f7f3;font-family:Arial,sans-serif}
header{padding:22px 6%;border-bottom:1px solid var(--line);font-size:24px;font-weight:900}
header span,h1 span{color:var(--green)}
.hero{padding:65px 6%;background:radial-gradient(ellipse at 85% 20%,#244629,transparent 65%)}
.tag{color:var(--green);font-size:12px;letter-spacing:3px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.3}
p{line-height:1.8}
.hero p,.muted{color:var(--muted)}
section{padding:35px 6%}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}
input,select{background:var(--panel);color:white;border:1px solid var(--line);border-radius:8px;padding:13px;font-size:14px}
input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--green)}
.photo{height:180px;background:radial-gradient(#263d2b,#101713);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:12px}
.photo img{width:100%;height:100%;object-fit:contain}
.mic{font-size:65px;color:var(--green)}
.content{padding:20px;flex:1;display:flex;flex-direction:column}
.brand{color:var(--green);font-size:12px;letter-spacing:2px}
h2{margin:10px 0}
.price{font-size:25px;font-weight:bold;margin:10px 0}
.spec{font-size:12px;background:#233329;padding:8px;border-radius:5px}
.info{font-size:14px;line-height:1.7}
.good{color:#a3ff57}
.bad{color:#ff9b91}
.use{color:#a9caff}
.amazon{display:block;background:#ff9900;color:#151515;text-align:center;text-decoration:none;padding:14px;border-radius:8px;font-weight:bold;margin-top:auto}
.amazon:hover{background:#ffb747}
footer{border-top:1px solid var(--line);padding:30px 6%;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>SORA <span>SELECT.</span></header>
<div class="hero">
<div class="tag">FIND YOUR BEST SOUND.</div>
<h1>最高の音を、<br><span>最高の選択で。</span></h1>
<p>ゲーム・配信・実況・録音。<br>あなたに合ったマイクを見つけよう。</p>
</div>
<section>
<h2>MICROPHONE SELECT.</h2>
<p class="muted">特徴・価格・用途からマイクを比較</p>
<div class="controls">
<input id="search" placeholder="商品名・メーカー名で検索">
<select id="connection">
<option value="all">すべての接続方式</option>
<option value="USB">USB接続</option>
<option value="XLR">XLR接続</option>
</select>
<select id="sort">
<option value="default">掲載順</option>
<option value="low">価格が安い順</option>
<option value="high">価格が高い順</option>
</select>
</div>
<p id="count" class="muted"></p>
<div class="grid" id="products"></div>
</section>
<footer>
<p>掲載価格は参考価格であり、現在の販売価格を保証するものではありません。Amazonで最新の価格・仕様をご確認ください。</p>
<p>使用感は製品の仕様に基づく一般的な評価であり、実機レビューではありません。</p>
© 2026 Sora Select.
</footer>
<script>
const products=[
{
brand:"FIFINE",name:"AM8",price:8000,
connection:"USB / XLR",kind:"ダイナミック",
good:"周囲の音を抑えやすく、USBとXLRの両方に対応。",
bad:"口元に近づけて使用する必要がある。",
use:"ゲーム実況・Discord・初めての配信",
image:""
},
{
brand:"FIFINE",name:"K688",price:10000,
connection:"USB / XLR",kind:"ダイナミック",
good:"価格を抑えながら落ち着いた声を録音しやすい。",
bad:"離れた位置からの集音には不向き。",
use:"配信・ナレーション・ポッドキャスト",
image:""
},
{
brand:"HyperX",name:"QuadCast 2",price:20000,
connection:"USB",kind:"コンデンサー",
good:"複数の指向性と便利なミュート機能。",
bad:"キーボード音や生活音を拾う場合がある。",
use:"ゲーム配信・通話・複数人での録音",
image:""
},
{
brand:"Audio-Technica",name:"AT2020USB-X",price:20000,
connection:"USB",kind:"コンデンサー",
good:"繊細な声や楽器の音を収録しやすい。",
bad:"反響や周囲の騒音に注意が必要。",
use:"歌ってみた・ナレーション・音声収録",
image:""
},
{
brand:"Razer",name:"Seiren V3 Chroma",price:18000,
connection:"USB",kind:"コンデンサー",
good:"RGB照明とタップ式ミュートを搭載。",
bad:"照明や専用機能を必要としない人には割高な場合がある。",
use:"ゲーム実況・デスク環境の演出",
image:""
},
{
brand:"Elgato",name:"Wave:3",price:20000,
connection:"USB",kind:"コンデンサー",
good:"Wave Linkによる配信音声の管理が便利。",
bad:"機能を活用するには対応PCとソフトが必要。",
use:"PC配信・ゲーム実況",
image:""
},
{
brand:"SHURE",name:"MV7",price:30000,
connection:"USB / XLR",kind:"ダイナミック",
good:"近接収録に適し、声を中心に録音しやすい。",
bad:"価格が高めで、マイクスタンドも必要。",
use:"本格配信・ポッドキャスト・実況",
image:""
},
{
brand:"RODE",name:"NT-USB Mini",price:15000,
connection:"USB",kind:"コンデンサー",
good:"コンパクトで設置しやすく、操作も簡単。",
bad:"設置位置によっては机の振動や環境音を拾う。",
use:"通話・宅録・省スペース環境",
image:""
},
{
brand:"MAONO",name:"PD200X",price:10000,
connection:"USB / XLR",kind:"ダイナミック",
good:"手頃な価格でUSBとXLRに対応。",
bad:"マイクとの距離やゲインの調整が必要。",
use:"ゲーム・配信初心者・通話",
image:""
},
{
brand:"FIFINE",name:"K688T",price:15000,
connection:"USB / XLR",kind:"ダイナミック",
good:"マイクアーム付きセットで環境を整えやすい。",
bad:"机へのアーム取り付けスペースが必要。",
use:"配信環境をまとめて揃えたい人",
image:""
}
];

function render(){
const search=document.getElementById("search").value.toLowerCase();
const connection=document.getElementById("connection").value;
const sort=document.getElementById("sort").value;

let list=products.filter(p=>
(p.brand+" "+p.name).toLowerCase().includes(search)
&&(connection==="all"||p.connection.includes(connection))
);

if(sort==="low")list.sort((a,b)=>a.price-b.price);
if(sort==="high")list.sort((a,b)=>b.price-a.price);

document.getElementById("count").textContent=list.length+"件の商品";

document.getElementById("products").innerHTML=list.map(p=>{
const url="https://www.amazon.co.jp/s?k="+encodeURIComponent(p.brand+" "+p.name);
return `
<article class="card">
<div class="photo">
${p.image?`<img src="${p.image}" alt="${p.brand} ${p.name}">`:`<div class="mic">🎙</div><span>商品写真準備中</span>`}
</div>
<div class="content">
<div class="brand">${p.brand}</div>
<h2>${p.name}</h2>
<div class="price">約 ¥${p.price.toLocaleString("ja-JP")}</div>
<div class="spec">${p.connection} ｜ ${p.kind}</div>
<div class="info">
<p><b class="good">✓ メリット</b><br>${p.good}</p>
<p><b class="bad">△ デメリット</b><br>${p.bad}</p>
<p><b class="use">おすすめの用途</b><br>${p.use}</p>
</div>
<a class="amazon" href="${url}" target="_blank" rel="noopener noreferrer">Amazonで商品を探す →</a>
</div>
</article>`;
}).join("");
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("connection").addEventListener("change",render);
document.getElementById("sort").addEventListener("change",render);
render();
</script>
</body>
</html>
